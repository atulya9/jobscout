<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobscout</title>
  <style>
    :root { color-scheme: light; --ink:#17211b; --muted:#657169; --paper:#f6f7f2; --card:#fff; --line:#dce2dc; --green:#146c43; --green-soft:#e4f3e9; --orange:#b45309; --orange-soft:#fff3e0; --red:#9b1c1c; --red-soft:#fde8e8; --shadow:0 12px 35px rgba(33,48,38,.09); }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
    header { padding:24px 32px 14px; display:flex; gap:22px; align-items:end; justify-content:space-between; }
    h1 { margin:0; font:700 30px/1.1 ui-serif, Georgia, serif; letter-spacing:-.02em; }
    h2 { margin:0 0 12px; font:700 18px/1.3 ui-serif, Georgia, serif; }
    .subtitle { margin:6px 0 0; color:var(--muted); }
    .actions, .tabs, .toolbar, .meta, .chip-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button, input, select, textarea { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:9px 12px; font:inherit; }
    button { cursor:pointer; font-weight:650; }
    button:hover { border-color:#aab6ad; }
    button.primary { background:var(--green); color:white; border-color:var(--green); }
    button.danger { color:var(--red); }
    button.ghost { background:transparent; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    main { padding:0 32px 36px; }
    .notice { background:var(--green-soft); border:1px solid #c1dfcb; border-radius:12px; padding:12px 14px; margin-bottom:16px; color:#24583c; }
    .notice.warn { background:var(--orange-soft); border-color:#f0d2a2; color:#7a3f04; }
    .tabs { margin-bottom:10px; }
    .tabs button.active { background:var(--ink); color:white; border-color:var(--ink); }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:15px; box-shadow:var(--shadow); overflow:hidden; }
    .toolbar { padding:12px; border-bottom:1px solid var(--line); justify-content:space-between; }
    .toolbar .left { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .count { color:var(--muted); font-variant-numeric:tabular-nums; }
    .kind-toggle { display:flex; padding:3px; border:1px solid var(--line); border-radius:11px; background:#f3f6f2; }
    .kind-toggle button { border:0; background:transparent; padding:7px 11px; border-radius:8px; }
    .kind-toggle button.active { background:white; box-shadow:0 1px 4px rgba(33,48,38,.12); }
    .list { padding:14px; display:flex; flex-direction:column; gap:10px; max-height:calc(100vh - 250px); overflow:auto; }
    .card { border:1px solid var(--line); border-radius:12px; background:#fff; padding:14px 16px; cursor:pointer; text-align:left; }
    .card:hover { border-color:#b7c4ba; }
    .card.unread { background:#fcfbf7; }
    .card-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .card h3 { margin:0 0 2px; font:700 16px/1.25 inherit; }
    .card .role { color:var(--green); font-weight:650; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    .card .role:hover { text-decoration:underline; }
    .ext-icon { width:13px; height:13px; flex:0 0 auto; opacity:.75; }
    .card .role:hover .ext-icon { opacity:1; }
    .meta { color:var(--muted); font-size:13px; margin-top:8px; }
    .pill { display:inline-flex; align-items:center; border-radius:999px; padding:3px 8px; font-size:12px; font-weight:700; background:#eef1ec; color:#4d5a51; }
    .pill.good { background:var(--green-soft); color:var(--green); }
    .pill.warn { background:var(--orange-soft); color:var(--orange); }
    .pill.bad { background:var(--red-soft); color:var(--red); }
    .status-select { padding:5px 8px; font-size:12px; font-weight:700; }
    .details { padding:18px; display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
    .field { display:flex; flex-direction:column; gap:4px; min-width:0; }
    .field.wide { grid-column:1 / -1; }
    .field label { font-size:11px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); font-weight:700; }
    .field input, .field textarea, .field select { width:100%; }
    .field textarea { min-height:76px; resize:vertical; }
    .url-field { display:flex; gap:6px; align-items:center; }
    .url-field input { flex:1; }
    .url-open { color:var(--green); font-size:12px; font-weight:700; text-decoration:none; padding:6px 8px; }
    .url-open[hidden] { display:none; }
    .qa-list { grid-column:1 / -1; display:flex; flex-direction:column; gap:8px; }
    .qa { border:1px solid #e6ebe6; border-radius:10px; padding:10px; background:#fbfcf9; }
    .qa summary { cursor:pointer; font-weight:650; }
    .qa-body { margin-top:8px; display:flex; flex-direction:column; gap:8px; }
    .table-wrap { overflow:auto; max-height:calc(100vh - 245px); }
    table { border-collapse:separate; border-spacing:0; min-width:100%; }
    th, td { padding:8px; border-bottom:1px solid #edf0ed; text-align:left; vertical-align:top; }
    th { position:sticky; top:0; background:#f0f3ee; font-size:12px; color:#4d5a51; }
    .empty { color:var(--muted); padding:28px 8px; text-align:center; }
    footer { padding:10px 32px 26px; color:var(--muted); }
    #status.error { color:var(--red); }
    #status.working { color:var(--orange); }
    @media (max-width:720px) {
      header { align-items:flex-start; flex-direction:column; }
      main, header, footer { padding-left:14px; padding-right:14px; }
      .details { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Jobscout</h1>
      <p class="subtitle">Local workspace data · backed up before every save</p>
    </div>
    <div class="actions">
      <button id="openFolder" class="ghost" hidden>Open data folder</button>
      <button id="reload">Reload</button>
      <button id="save" class="primary">Save changes</button>
    </div>
  </header>
  <main>
    <div id="notice" class="notice">Loading workspace data…</div>
    <nav id="tabs" class="tabs" aria-label="Jobscout sections"></nav>
    <section class="panel">
      <div class="toolbar">
        <div class="left" id="toolbarLeft"></div>
        <span id="count" class="count"></span>
      </div>
      <div id="view"></div>
    </section>
  </main>
  <footer><span id="status">Starting…</span></footer>

  <script>
    const TABLES = ['applications.csv', 'application-qa.csv', 'resume-builds.csv', 'search-runs.csv', 'search-sources.csv'];
    const STATUSES = ['New', 'Applied', 'In process', 'Rejected', 'Skipped', 'Broken'];
    const ROLE_TYPES = ['Full Time', 'Contract', 'Part Time', 'Internship', 'Freelance'];
    const RUN_STATUSES = ['running', 'completed', 'partial'];
    const SOURCE_STATUSES = ['ok', 'partial', 'blocked', 'login-required', 'not-checked'];
    const LONG_FIELDS = new Set(['fit_summary','gaps','user_notes','notes','failure_reason','checks_attempted','question','answer','evidence','blocked_sources','change_summary','unsupported_requirements']);
    const DATE_HEADER = /^(?:.+_(?:at|date)|first_seen|last_seen|last_verified|last_checked|generated_at)$/;
    const UI_KEY = 'jobscout:ui';
    const SORTS = [
      ['updated_at:desc', 'Recently updated'],
      ['first_seen:desc', 'Newest first'],
      ['company:asc', 'Company A–Z'],
      ['status:asc', 'Status'],
      ['score:desc', 'Highest score']
    ];
    const ROLE_FIELDS = ['status','role_type','jd_verified','application_date','score','compensation','location','work_arrangement','track','source','verification','url','canonical_url','first_seen','last_verified','updated_at','user_notes','fit_summary','gaps','failure_reason','checks_attempted'];
    const RESUME_FIELDS = ['company','role','job_id','profile_id','review_status','match_score','tailoring_level','source_jd_url','html_path','pdf_path','generated_at','change_summary','unsupported_requirements','notes'];
    const RUN_FIELDS = ['run_id','started_at','completed_at','query_date','status','portals_checked','roles_found','roles_added','jd_needed_added','duplicates_skipped','blocked_sources','notes'];
    const SOURCE_FIELDS = ['source','base_url','category','default_method','fallback_method','requires_login','enabled','last_checked','status','notes'];
    const FIELD_LABELS = {
      url: 'Listing URL',
      canonical_url: 'Official apply URL',
      source_jd_url: 'Source JD URL',
      jd_verified: 'JD verified',
      pdf_path: 'Resume PDF path',
      html_path: 'Resume HTML path',
      base_url: 'Base URL',
      role_type: 'Role type'
    };

    const state = {
      source: null,
      directory: null,
      data: new Map(),
      dirty: new Set(),
      toolbarView: '',
      filters: { query: '', kind: 'all', status: '', roleSort: 'updated_at:desc' }
    };
    const $ = selector => document.querySelector(selector);

    function migratePref(oldKey, newKey) {
      if (localStorage.getItem(newKey) != null) return;
      const previous = localStorage.getItem(oldKey);
      if (previous != null) { localStorage.setItem(newKey, previous); localStorage.removeItem(oldKey); }
    }
    migratePref('portable-job-search:ui', UI_KEY);

    function loadUi() {
      try {
        const saved = JSON.parse(localStorage.getItem(UI_KEY) || '{}');
        if (['all', 'verified', 'unread'].includes(saved.kind)) state.filters.kind = saved.kind;
        if (typeof saved.status === 'string') state.filters.status = saved.status;
        if (typeof saved.query === 'string') state.filters.query = saved.query;
        if (SORTS.some(([id]) => id === saved.roleSort)) state.filters.roleSort = saved.roleSort;
      } catch { /* ignore */ }
    }
    function saveUi() {
      localStorage.setItem(UI_KEY, JSON.stringify(state.filters));
    }

    function nowStamp() {
      const now = new Date();
      const pad = value => String(value).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    function today() { return nowStamp().slice(0, 10); }

    function parseTime(value) {
      const text = String(value ?? '').trim();
      if (!text) return null;
      const ms = /^\d{4}-\d{2}-\d{2}$/.test(text) ? Date.parse(`${text}T23:59:59.999`) : Date.parse(text);
      return Number.isNaN(ms) ? null : ms;
    }
    function formatWhen(value) {
      const ms = parseTime(value);
      if (ms == null) return value || '—';
      return new Date(ms).toLocaleString([], { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function httpUrlFrom(value) {
      const text = String(value ?? '').trim();
      if (!text) return '';
      const matches = text.match(/https?:\/\/[^\s<>"']+/ig) || [];
      if (/^https?:\/\//i.test(text)) matches.unshift(text.split(/\s/)[0]);
      for (const candidate of matches) {
        try {
          const url = new URL(candidate);
          if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
        } catch { /* ignore */ }
      }
      return '';
    }

    function parseCsv(text) {
      const rows = []; let row = [], field = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (quoted) {
          if (char === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (char === '"') quoted = false;
          else field += char;
        } else if (char === '"') quoted = true;
        else if (char === ',') { row.push(field); field = ''; }
        else if (char === '\n') { row.push(field.replace(/\r$/, '')); rows.push(row); row = []; field = ''; }
        else field += char;
      }
      if (field || row.length) { row.push(field.replace(/\r$/, '')); rows.push(row); }
      return rows.filter((value, index) => index === 0 || value.some(cell => cell !== ''));
    }
    function csvCell(value) {
      value = String(value ?? '');
      return /[",\r\n]/.test(value) ? `"${value.replaceAll('"', '""')}"` : value;
    }
    function toCsv(matrix) { return matrix.map(row => row.map(csvCell).join(',')).join('\n') + '\n'; }

    function setStatus(message, kind = '') {
      $('#status').textContent = message;
      $('#status').className = kind;
    }

    function headersOf(name) { return (state.data.get(name) || [[]])[0] || []; }
    function recordsOf(name) {
      const matrix = state.data.get(name) || [[]];
      const headers = matrix[0] || [];
      return matrix.slice(1).map((row, index) => {
        const record = { _table: name, _index: index + 1 };
        headers.forEach((header, column) => { record[header] = row[column] ?? ''; });
        return record;
      });
    }

    function writeField(table, index, header, value, { touch = true } = {}) {
      const matrix = state.data.get(table);
      if (!matrix) return;
      const column = matrix[0].indexOf(header);
      if (column < 0 || !matrix[index]) return;
      matrix[index][column] = value;
      state.dirty.add(table);
      if (touch && header !== 'updated_at' && table === 'applications.csv') {
        const updated = matrix[0].indexOf('updated_at');
        if (updated >= 0) matrix[index][updated] = nowStamp();
        if (header === 'status' && value === 'Applied') {
          const applied = matrix[0].indexOf('application_date');
          if (applied >= 0 && !String(matrix[index][applied] || '').trim()) matrix[index][applied] = today();
        }
        if (header === 'jd_verified' && value === 'true') {
          const verified = matrix[0].indexOf('last_verified');
          if (verified >= 0 && !String(matrix[index][verified] || '').trim()) matrix[index][verified] = today();
        }
      }
      $('#save').disabled = false;
      renderTabs();
    }

    function isVerified(record) { return String(record.jd_verified).toLowerCase() === 'true'; }
    function listingUrl(record) { return httpUrlFrom(record.canonical_url || record.url); }
    function qaCount(jobId) {
      if (!jobId) return 0;
      return recordsOf('application-qa.csv').filter(row => row.job_id === jobId).length;
    }
    function qaFor(jobId) {
      if (!jobId) return [];
      return recordsOf('application-qa.csv').filter(row => row.job_id === jobId);
    }
    function resumeFor(jobId) {
      if (!jobId) return null;
      const matches = recordsOf('resume-builds.csv').filter(row => row.job_id === jobId);
      return matches.sort((a, b) => (parseTime(b.generated_at) || 0) - (parseTime(a.generated_at) || 0))[0] || null;
    }
    function statusTone(status) {
      if (status === 'Applied' || status === 'In process') return 'good';
      if (status === 'New') return 'warn';
      if (status === 'Rejected' || status === 'Broken' || status === 'Skipped') return 'bad';
      return '';
    }

    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (value == null || value === false) continue;
        if (key === 'class') node.className = value;
        else if (key === 'text') node.textContent = value;
        else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2), value);
        else node.setAttribute(key, value === true ? '' : value);
      }
      for (const child of children.flat()) {
        if (child == null || child === false) continue;
        node.append(child.nodeType ? child : document.createTextNode(child));
      }
      return node;
    }

    function compareValues(header, left, right) {
      if (DATE_HEADER.test(header)) {
        const aTime = parseTime(left);
        const bTime = parseTime(right);
        if (aTime !== null && bTime !== null && aTime !== bTime) return aTime - bTime;
      }
      return String(left).localeCompare(String(right), undefined, { numeric: true, sensitivity: 'base' });
    }

    function sortRecords(records, spec) {
      const [header, dirName] = spec.split(':');
      const dir = dirName === 'desc' ? -1 : 1;
      return records.slice().sort((a, b) => {
        const aText = String(a[header] ?? '').trim();
        const bText = String(b[header] ?? '').trim();
        if (!aText && !bText) return a._index - b._index;
        if (!aText) return 1;
        if (!bText) return -1;
        const cmp = compareValues(header, aText, bText);
        return cmp ? cmp * dir : a._index - b._index;
      });
    }

    function route() {
      const raw = location.hash.replace(/^#/, '') || '/roles';
      const parts = raw.split('/').filter(Boolean);
      if (parts[0] === 'role' && parts[1]) return { view: 'role', id: decodeURIComponent(parts[1]) };
      if (parts[0] === 'resume' && parts[1]) return { view: 'resume', id: decodeURIComponent(parts[1]) };
      if (parts[0] === 'resumes') return { view: 'resumes' };
      if (parts[0] === 'run' && parts[1]) return { view: 'run', id: decodeURIComponent(parts[1]) };
      if (parts[0] === 'runs') return { view: 'runs' };
      if (parts[0] === 'source' && parts[1]) return { view: 'source', id: decodeURIComponent(parts[1]) };
      if (parts[0] === 'sources') return { view: 'sources' };
      return { view: 'roles' };
    }
    function go(path) { location.hash = path; }

    function visibleRoles() {
      return recordsOf('applications.csv').filter(record => {
        if (state.filters.kind === 'verified' && !isVerified(record)) return false;
        if (state.filters.kind === 'unread' && isVerified(record)) return false;
        if (state.filters.status && record.status !== state.filters.status) return false;
        const query = state.filters.query.trim().toLowerCase();
        if (!query) return true;
        return ['company','role','role_type','location','compensation','status','source'].some(key => String(record[key] || '').toLowerCase().includes(query));
      });
    }

    async function detectApi() {
      try { return (await fetch('/api/meta', { cache: 'no-store' })).ok; }
      catch { return false; }
    }
    async function readFromApi(name) {
      const response = await fetch(`/api/data/${name}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Could not read ${name}`);
      return parseCsv(await response.text());
    }
    async function readFromFolder(name) {
      const handle = await state.directory.getFileHandle(name);
      return parseCsv(await (await handle.getFile()).text());
    }
    async function loadAll() {
      setStatus('Reading CSV files…', 'working');
      const read = state.source === 'api' ? readFromApi : readFromFolder;
      for (const name of TABLES) state.data.set(name, await read(name));
      state.dirty.clear();
      $('#notice').hidden = true;
      $('#save').disabled = true;
      render();
      setStatus(state.source === 'api' ? 'Loaded from the local Jobscout server.' : 'Loaded from the selected data folder.');
    }
    async function saveTable(name) {
      const csv = toCsv(state.data.get(name));
      if (state.source === 'api') {
        const response = await fetch(`/api/data/${name}`, { method: 'PUT', headers: { 'Content-Type': 'text/csv; charset=utf-8' }, body: csv });
        if (!response.ok) throw new Error(await response.text());
        return;
      }
      const handle = await state.directory.getFileHandle(name);
      const previous = await (await handle.getFile()).text();
      const backups = await state.directory.getDirectoryHandle('backups', { create: true });
      const backup = await backups.getFileHandle(`${name.replace('.csv', '')}-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`, { create: true });
      const write = async (fileHandle, text) => { const writable = await fileHandle.createWritable(); await writable.write(text); await writable.close(); };
      await write(backup, previous);
      await write(handle, csv);
    }
    async function saveAll() {
      if (!state.dirty.size) { setStatus('Nothing to save.'); return; }
      setStatus('Saving…', 'working');
      for (const name of [...state.dirty]) await saveTable(name);
      state.dirty.clear();
      render();
      setStatus('Saved. A backup was created for each written table.');
    }

    function renderTabs() {
      const current = route().view;
      const tabs = [
        ['roles', 'Roles', '#/roles', ['applications.csv', 'application-qa.csv']],
        ['resumes', 'Resume builds', '#/resumes', ['resume-builds.csv']],
        ['runs', 'Search runs', '#/runs', ['search-runs.csv']],
        ['sources', 'Sources', '#/sources', ['search-sources.csv']]
      ];
      $('#tabs').replaceChildren(...tabs.map(([id, label, href, files]) => {
        const dirty = files.some(name => state.dirty.has(name));
        const active = current === id || (id === 'roles' && current === 'role') || (id === 'resumes' && current === 'resume') || (id === 'runs' && current === 'run') || (id === 'sources' && current === 'source');
        return el('button', { class: active ? 'active' : '', text: `${label}${dirty ? ' •' : ''}`, onclick: () => {
          const groups = { role: 'roles', roles: 'roles', resume: 'resumes', resumes: 'resumes', run: 'runs', runs: 'runs', source: 'sources', sources: 'sources' };
          if (groups[current] !== id) { state.filters.query = ''; saveUi(); }
          go(href);
        } });
      }));
    }

    function statusesFor(table) {
      if (table === 'search-sources.csv') return SOURCE_STATUSES;
      if (table === 'search-runs.csv') return RUN_STATUSES;
      return STATUSES;
    }

    function fieldControl(table, record, header) {
      const isSelect = header === 'status' || header === 'jd_verified' || header === 'role_type';
      const control = isSelect ? el('select') : el(LONG_FIELDS.has(header) ? 'textarea' : 'input');
      if (header === 'status') {
        const options = statusesFor(table);
        const current = record[header] ?? '';
        if (current && !options.includes(current)) options.unshift(current);
        options.forEach(status => control.append(el('option', { value: status, text: status })));
      }
      if (header === 'role_type') {
        control.append(el('option', { value: '', text: 'Not stated' }));
        ROLE_TYPES.forEach(type => control.append(el('option', { value: type, text: type })));
      }
      if (header === 'jd_verified') {
        control.append(el('option', { value: 'true', text: 'True' }), el('option', { value: 'false', text: 'False' }));
      }
      control.value = header === 'jd_verified' ? (isVerified(record) ? 'true' : 'false') : (record[header] ?? '');
      if (header === 'updated_at' || header === 'first_seen' || header === 'last_verified') control.readOnly = true;
      control.addEventListener('input', () => writeField(table, record._index, header, control.value));
      control.addEventListener('change', () => writeField(table, record._index, header, control.value));
      const opener = el('a', { class: 'url-open', target: '_blank', rel: 'noopener noreferrer', text: 'Open' });
      const href = httpUrlFrom(control.value);
      if (href) opener.href = href; else opener.hidden = true;
      control.addEventListener('input', () => {
        const next = httpUrlFrom(control.value);
        if (next) { opener.href = next; opener.hidden = false; } else { opener.removeAttribute('href'); opener.hidden = true; }
      });
      const body = /url/i.test(header) ? el('div', { class: 'url-field' }, control, opener) : control;
      return el('div', { class: `field${LONG_FIELDS.has(header) ? ' wide' : ''}` },
        el('label', { text: FIELD_LABELS[header] || header.replaceAll('_', ' ') }),
        body
      );
    }

    function renderRoleCard(record) {
      const href = listingUrl(record);
      const card = el('article', { class: `card${isVerified(record) ? '' : ' unread'}` });
      card.addEventListener('click', () => go(`#/role/${encodeURIComponent(record.job_id)}`));
      const extIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      extIcon.setAttribute('class', 'ext-icon');
      extIcon.setAttribute('viewBox', '0 0 16 16');
      extIcon.setAttribute('aria-hidden', 'true');
      extIcon.innerHTML = '<path fill="currentColor" d="M6.5 3a.75.75 0 0 0 0 1.5h3.19L3.22 11.97a.75.75 0 1 0 1.06 1.06L10.75 5.56V8.75a.75.75 0 0 0 1.5 0v-5A.75.75 0 0 0 11.5 3h-5Z"/>';
      const roleLink = href
        ? el('a', { class: 'role', href, target: '_blank', rel: 'noopener noreferrer', title: 'Opens the listing in a new tab', onclick: event => event.stopPropagation() },
            record.role || 'Untitled role',
            extIcon
          )
        : el('div', { class: 'role', text: record.role || 'Untitled role' });
      const title = el('div', {},
        el('h3', { text: record.company || '(new role)' }),
        roleLink
      );
      const status = el('select', { class: `status-select pill ${statusTone(record.status)}` });
      STATUSES.forEach(value => status.append(el('option', { value, text: value })));
      status.value = STATUSES.includes(record.status) ? record.status : 'New';
      status.addEventListener('click', event => event.stopPropagation());
      status.addEventListener('change', event => {
        event.stopPropagation();
        writeField('applications.csv', record._index, 'status', status.value);
        renderList();
      });
      card.append(el('div', { class: 'card-top' }, title, status));
      card.append(el('div', { class: 'meta' },
        el('span', { text: record.role_type || 'Type not listed' }),
        el('span', { text: '·' }),
        el('span', { text: record.compensation || 'Pay not listed' }),
        el('span', { text: '·' }),
        el('span', { text: record.location || 'Location unknown' })
      ));
      card.append(el('div', { class: 'meta' },
        el('span', { text: `Updated ${formatWhen(record.updated_at || record.first_seen)}` }),
        el('span', { text: '·' }),
        el('span', { class: `pill ${isVerified(record) ? 'good' : 'warn'}`, text: `JD verified: ${isVerified(record) ? 'True' : 'False'}` }),
        el('span', { text: '·' }),
        el('span', { text: `${qaCount(record.job_id)} Q&A` })
      ));
      return card;
    }

    function searchBox(placeholder) {
      return el('input', {
        id: 'toolbarSearch',
        type: 'search',
        placeholder,
        value: state.filters.query,
        oninput: event => {
          state.filters.query = event.target.value;
          saveUi();
          renderList();
        }
      });
    }

    function renderRolesToolbar() {
      const statuses = [...new Set(recordsOf('applications.csv').map(row => row.status).filter(Boolean))];
      $('#toolbarLeft').replaceChildren(
        el('div', { class: 'kind-toggle' },
          ...[['all', 'All'], ['verified', 'JD verified'], ['unread', 'JD needed']].map(([id, label]) =>
            el('button', { class: state.filters.kind === id ? 'active' : '', text: label, onclick: event => {
              state.filters.kind = id;
              saveUi();
              event.currentTarget.parentElement.querySelectorAll('button').forEach(button => button.classList.toggle('active', button === event.currentTarget));
              renderList();
            } })
          )
        ),
        searchBox('Filter roles…'),
        (() => {
          const select = el('select', { onchange: event => { state.filters.status = event.target.value; saveUi(); renderList(); } },
            el('option', { value: '', text: 'All statuses' }),
            ...STATUSES.filter(status => statuses.includes(status)).map(status => el('option', { value: status, text: status }))
          );
          select.value = state.filters.status;
          return select;
        })(),
        (() => {
          const select = el('select', { onchange: event => { state.filters.roleSort = event.target.value; saveUi(); renderList(); } },
            ...SORTS.map(([id, label]) => el('option', { value: id, text: label }))
          );
          select.value = state.filters.roleSort;
          return select;
        })(),
        el('button', { text: 'Add role', onclick: addRole })
      );
    }

    function renderRolesList() {
      const rows = sortRecords(visibleRoles(), state.filters.roleSort);
      const list = el('div', { class: 'list' });
      if (!rows.length) list.append(el('div', { class: 'empty', text: 'No roles match these filters.' }));
      rows.forEach(record => list.append(renderRoleCard(record)));
      $('#view').replaceChildren(list);
      $('#count').textContent = `${rows.length} role${rows.length === 1 ? '' : 's'}`;
    }

    function addQuestion(job) {
      const table = 'application-qa.csv';
      const matrix = state.data.get(table);
      const existing = qaFor(job.job_id);
      let max = 0;
      for (const item of existing) {
        const match = String(item.qa_id).match(/-q(\d+)$/i);
        if (match) max = Math.max(max, Number(match[1]));
      }
      const row = matrix[0].map(header => {
        if (header === 'qa_id') return `${job.job_id || 'job'}-q${String(max + 1).padStart(2, '0')}`;
        if (header === 'job_id') return job.job_id || '';
        if (header === 'company') return job.company || '';
        if (header === 'role') return job.role || '';
        if (header === 'url') return job.url || job.canonical_url || '';
        if (header === 'answer_status') return 'draft';
        if (header === 'created_at' || header === 'updated_at') return today();
        return '';
      });
      matrix.push(row);
      state.dirty.add(table);
      render();
    }

    function renderRoleDetail(id) {
      const record = recordsOf('applications.csv').find(row => row.job_id === id);
      $('#toolbarLeft').replaceChildren(
        el('button', { text: 'Back to roles', onclick: () => go('#/roles') }),
        record ? el('button', { class: 'danger', text: 'Delete role', onclick: () => deleteRole(record) }) : null
      );
      if (!record) {
        $('#view').replaceChildren(el('div', { class: 'empty', text: 'Role not found.' }));
        $('#count').textContent = '';
        return;
      }
      const questions = qaFor(record.job_id);
      const resume = resumeFor(record.job_id);
      const box = el('div', { class: 'details' },
        el('div', { class: 'field wide' }, el('h2', { text: `${record.company || 'Role'} — ${record.role || ''}` })),
        ...ROLE_FIELDS.filter(header => headersOf('applications.csv').includes(header)).map(header => fieldControl('applications.csv', record, header))
      );
      const qa = el('div', { class: 'qa-list' },
        el('div', { class: 'toolbar' }, el('h2', { text: 'Application Q&A' }), el('button', { text: 'Add question', onclick: () => addQuestion(record) }))
      );
      if (!questions.length) qa.append(el('div', { class: 'empty', text: 'No questions recorded.' }));
      for (const item of questions) {
        const details = el('details', { class: 'qa', open: item.answer_status === 'needs-user-input' });
        details.append(
          el('summary', { text: `${item.question || 'Untitled question'} · ${item.answer_status || 'draft'}` }),
          el('div', { class: 'qa-body' },
            fieldControl('application-qa.csv', item, 'question'),
            fieldControl('application-qa.csv', item, 'answer'),
            fieldControl('application-qa.csv', item, 'evidence'),
            fieldControl('application-qa.csv', item, 'answer_status'),
            el('button', { class: 'danger', text: 'Remove question', onclick: () => {
              if (!confirm('Remove this question?')) return;
              state.data.get('application-qa.csv').splice(item._index, 1);
              state.dirty.add('application-qa.csv');
              render();
            } })
          )
        );
        qa.append(details);
      }
      if (resume) {
        qa.append(el('div', { class: 'qa' },
          el('strong', { text: 'Resume' }),
          el('div', { class: 'meta', text: `${resume.pdf_path || resume.html_path || 'No path'} · ${resume.profile_id || ''} · ${resume.review_status || ''}` }),
          el('button', { class: 'ghost', text: 'Open resume build', onclick: () => go(`#/resume/${encodeURIComponent(resume.resume_id)}`) })
        ));
      }
      box.append(qa);
      $('#view').replaceChildren(box);
      $('#count').textContent = isVerified(record) ? 'JD verified' : 'JD needed';
    }

    function renderResumeCard(record) {
      const job = [record.company, record.role].filter(Boolean).join(' — ') || record.profile_id || record.resume_id || 'Resume build';
      const card = el('article', { class: 'card' });
      card.addEventListener('click', () => go(`#/resume/${encodeURIComponent(record.resume_id)}`));
      card.append(
        el('h3', { text: job }),
        el('div', { class: 'meta', text: record.pdf_path || 'No PDF path' })
      );
      return card;
    }

    function renderResumesToolbar() {
      $('#toolbarLeft').replaceChildren(searchBox('Filter builds…'));
    }

    function renderResumesList() {
      const query = state.filters.query.trim().toLowerCase();
      const rows = recordsOf('resume-builds.csv')
        .filter(record => !query || [record.company, record.role, record.pdf_path, record.profile_id].some(value => String(value || '').toLowerCase().includes(query)))
        .sort((a, b) => (parseTime(b.generated_at) || 0) - (parseTime(a.generated_at) || 0));
      const list = el('div', { class: 'list' });
      if (!rows.length) list.append(el('div', { class: 'empty', text: 'No resume builds match.' }));
      rows.forEach(record => list.append(renderResumeCard(record)));
      $('#view').replaceChildren(list);
      $('#count').textContent = `${rows.length} build${rows.length === 1 ? '' : 's'}`;
    }

    function renderResumeDetail(id) {
      const record = recordsOf('resume-builds.csv').find(row => row.resume_id === id);
      $('#toolbarLeft').replaceChildren(
        el('button', { text: 'Back to resume builds', onclick: () => go('#/resumes') }),
        record?.job_id ? el('button', { text: 'Open role', onclick: () => go(`#/role/${encodeURIComponent(record.job_id)}`) }) : null
      );
      if (!record) {
        $('#view').replaceChildren(el('div', { class: 'empty', text: 'Resume build not found.' }));
        $('#count').textContent = '';
        return;
      }
      $('#view').replaceChildren(el('div', { class: 'details' },
        el('div', { class: 'field wide' }, el('h2', { text: [record.company, record.role].filter(Boolean).join(' — ') || record.resume_id })),
        ...RESUME_FIELDS.filter(header => headersOf('resume-builds.csv').includes(header)).map(header => fieldControl('resume-builds.csv', record, header))
      ));
      $('#count').textContent = record.pdf_path || '';
    }

    function matchesQuery(record, keys) {
      const query = state.filters.query.trim().toLowerCase();
      if (!query) return true;
      return keys.some(key => String(record[key] || '').toLowerCase().includes(query));
    }

    function renderRunCard(record) {
      const card = el('article', { class: 'card' });
      card.addEventListener('click', () => go(`#/run/${encodeURIComponent(record.run_id)}`));
      card.append(
        el('h3', { text: record.run_id || 'Search run' }),
        el('div', { class: 'meta' },
          el('span', { class: `pill ${statusTone(record.status === 'complete' ? 'Applied' : record.status === 'partial' ? 'New' : '')}`, text: record.status || 'unknown' }),
          el('span', { text: '·' }),
          el('span', { text: formatWhen(record.started_at || record.query_date) })
        ),
        el('div', { class: 'meta', text: `${record.roles_found || 0} found · ${record.roles_added || 0} added · ${record.jd_needed_added || 0} unread JDs` })
      );
      return card;
    }

    function renderRunsToolbar() {
      $('#toolbarLeft').replaceChildren(searchBox('Filter runs…'));
    }

    function renderRunsList() {
      const rows = recordsOf('search-runs.csv')
        .filter(record => matchesQuery(record, ['run_id','status','notes','query_date','blocked_sources']))
        .sort((a, b) => (parseTime(b.started_at || b.query_date) || 0) - (parseTime(a.started_at || a.query_date) || 0));
      const list = el('div', { class: 'list' });
      if (!rows.length) list.append(el('div', { class: 'empty', text: 'No search runs match.' }));
      rows.forEach(record => list.append(renderRunCard(record)));
      $('#view').replaceChildren(list);
      $('#count').textContent = `${rows.length} run${rows.length === 1 ? '' : 's'}`;
    }

    function renderRunDetail(id) {
      const record = recordsOf('search-runs.csv').find(row => row.run_id === id);
      $('#toolbarLeft').replaceChildren(el('button', { text: 'Back to search runs', onclick: () => go('#/runs') }));
      if (!record) {
        $('#view').replaceChildren(el('div', { class: 'empty', text: 'Search run not found.' }));
        $('#count').textContent = '';
        return;
      }
      $('#view').replaceChildren(el('div', { class: 'details' },
        el('div', { class: 'field wide' }, el('h2', { text: record.run_id })),
        ...RUN_FIELDS.filter(header => headersOf('search-runs.csv').includes(header)).map(header => fieldControl('search-runs.csv', record, header))
      ));
      $('#count').textContent = record.status || '';
    }

    function renderSourceCard(record) {
      const href = httpUrlFrom(record.base_url);
      const card = el('article', { class: 'card' });
      card.addEventListener('click', () => go(`#/source/${encodeURIComponent(record.source)}`));
      const title = href
        ? el('a', { class: 'role', href, target: '_blank', rel: 'noopener noreferrer', text: record.source || 'Source', onclick: event => event.stopPropagation() })
        : el('h3', { text: record.source || 'Source' });
      card.append(
        el('div', { class: 'card-top' },
          href ? el('h3', {}, title) : title,
          el('span', { class: `pill ${record.status === 'ok' ? 'good' : record.status === 'partial' ? 'warn' : 'bad'}`, text: record.status || 'unknown' })
        ),
        el('div', { class: 'meta', text: [record.category, record.enabled === 'false' ? 'disabled' : 'enabled', record.last_checked ? `Checked ${formatWhen(record.last_checked)}` : ''].filter(Boolean).join(' · ') })
      );
      return card;
    }

    function renderSourcesToolbar() {
      $('#toolbarLeft').replaceChildren(searchBox('Filter sources…'));
    }

    function renderSourcesList() {
      const rows = recordsOf('search-sources.csv')
        .filter(record => matchesQuery(record, ['source','base_url','category','status','notes','default_method']));
      const list = el('div', { class: 'list' });
      if (!rows.length) list.append(el('div', { class: 'empty', text: 'No sources match.' }));
      rows.forEach(record => list.append(renderSourceCard(record)));
      $('#view').replaceChildren(list);
      $('#count').textContent = `${rows.length} source${rows.length === 1 ? '' : 's'}`;
    }

    function renderSourceDetail(id) {
      const record = recordsOf('search-sources.csv').find(row => row.source === id);
      $('#toolbarLeft').replaceChildren(el('button', { text: 'Back to sources', onclick: () => go('#/sources') }));
      if (!record) {
        $('#view').replaceChildren(el('div', { class: 'empty', text: 'Source not found.' }));
        $('#count').textContent = '';
        return;
      }
      $('#view').replaceChildren(el('div', { class: 'details' },
        el('div', { class: 'field wide' }, el('h2', { text: record.source })),
        ...SOURCE_FIELDS.filter(header => headersOf('search-sources.csv').includes(header)).map(header => fieldControl('search-sources.csv', record, header))
      ));
      $('#count').textContent = record.status || '';
    }

    function addRole() {
      const matrix = state.data.get('applications.csv');
      const row = matrix[0].map(header => {
        if (header === 'job_id') return `job-${Date.now()}`;
        if (header === 'status') return 'New';
        if (header === 'jd_verified') return 'false';
        if (header === 'first_seen' || header === 'updated_at') return nowStamp();
        return '';
      });
      matrix.push(row);
      state.dirty.add('applications.csv');
      go(`#/role/${encodeURIComponent(row[0])}`);
    }

    function deleteRole(record) {
      if (!confirm(`Delete ${record.company || 'this role'}? A backup is made when you save.`)) return;
      state.data.get('applications.csv').splice(record._index, 1);
      state.dirty.add('applications.csv');
      go('#/roles');
    }

    function renderToolbar(current) {
      if (current.view === 'roles') renderRolesToolbar();
      else if (current.view === 'resumes') renderResumesToolbar();
      else if (current.view === 'runs') renderRunsToolbar();
      else if (current.view === 'sources') renderSourcesToolbar();
    }

    function renderList() {
      const current = route();
      if (current.view === 'roles') renderRolesList();
      else if (current.view === 'resumes') renderResumesList();
      else if (current.view === 'runs') renderRunsList();
      else if (current.view === 'sources') renderSourcesList();
    }

    function render() {
      renderTabs();
      const current = route();
      if (state.toolbarView !== current.view) {
        state.toolbarView = current.view;
        renderToolbar(current);
      }
      if (current.view === 'roles') renderRolesList();
      else if (current.view === 'role') renderRoleDetail(current.id);
      else if (current.view === 'resumes') renderResumesList();
      else if (current.view === 'resume') renderResumeDetail(current.id);
      else if (current.view === 'runs') renderRunsList();
      else if (current.view === 'run') renderRunDetail(current.id);
      else if (current.view === 'sources') renderSourcesList();
      else if (current.view === 'source') renderSourceDetail(current.id);
      $('#save').disabled = state.dirty.size === 0;
    }

    $('#reload').onclick = async () => {
      if (state.dirty.size && !confirm('Discard unsaved changes and reload?')) return;
      try { await loadAll(); } catch (error) { setStatus(error.message, 'error'); }
    };
    $('#save').onclick = async () => { try { await saveAll(); } catch (error) { setStatus(error.message, 'error'); } };
    $('#openFolder').onclick = async () => {
      try {
        state.directory = await window.showDirectoryPicker({ mode: 'readwrite' });
        state.source = 'folder';
        await loadAll();
      } catch (error) {
        if (error.name !== 'AbortError') setStatus(error.message, 'error');
      }
    };
    window.addEventListener('hashchange', render);

    loadUi();
    (async () => {
      if (await detectApi()) {
        state.source = 'api';
        try { await loadAll(); }
        catch (error) {
          $('#notice').className = 'notice warn';
          $('#notice').textContent = `Could not load workspace data: ${error.message}`;
          setStatus(error.message, 'error');
        }
        return;
      }
      $('#openFolder').hidden = false;
      $('#notice').className = 'notice warn';
      $('#notice').innerHTML = 'This page is not being served from the Jobscout server. Run <code>npm run tracker</code> or choose the data folder.';
      setStatus('Waiting for a data folder.');
    })();
  </script>
</body>
</html>
